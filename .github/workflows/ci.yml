name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: purplesol
          POSTGRES_PASSWORD: purplesol
          POSTGRES_DB: purplesol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U purplesol" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies (CPU PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://purplesol:purplesol@localhost:5432/purplesol_test' || '' }}
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          API_ORIGIN: https://api.example.invalid

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t purplesol-api backend
      - name: Build worker image
        run: docker build -t purplesol-worker -f backend/Dockerfile.worker backend
      - name: Worker image can load the model
        run: docker run --rm --entrypoint python purplesol-worker -c "from app.cv.detector import PersonDetector; d=PersonDetector(); d.load(); print(d.model_sha256)"
