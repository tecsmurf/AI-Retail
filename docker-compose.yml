# Local full stack: Postgres + API + worker (+ optional MinIO for S3 testing).
#   docker compose up --build
#   docker compose --profile s3 up --build      # with MinIO
# Frontend: cd frontend && API_ORIGIN=http://localhost:8000 npm run dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: purplesol
      POSTGRES_USER: purplesol
      POSTGRES_PASSWORD: purplesol
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purplesol"]
      interval: 5s
      retries: 10

  migrate:
    build: ./backend
    command: python -m app.migrate
    environment: &env
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://purplesol:purplesol@postgres:5432/purplesol
      SECRET_KEY: local-compose-secret-not-for-production-use
      STORAGE_LOCAL_DIR: /data/storage
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@purplesol.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      API_CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: ./backend
    environment: *env
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    user: root
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: {context: ./backend, dockerfile: Dockerfile.worker}
    environment: *env
    volumes: [storage:/data/storage]
    user: root
    depends_on:
      migrate: {condition: service_completed_successfully}

  minio:
    profiles: [s3]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: purplesol
      MINIO_ROOT_PASSWORD: purplesol-minio
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
  storage:
