[project]
name = "purplesol-backend"
version = "2.0.0"
description = "PurpleSol retail analytics API and video worker"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "cv: needs the CV stack (torch, ultralytics, opencv) and ffmpeg",
    "postgres: needs TEST_POSTGRES_URL",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "B904", "B905", "UP006", "UP007", "UP035", "UP038"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
